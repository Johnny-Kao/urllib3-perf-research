name: gzip PR5304 evidence

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  correctness-stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-14
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Verify source provenance
        shell: bash
        run: |
          python - <<'PY'
          import urllib3.response
          source = urllib3.response.__file__.replace("\\", "/")
          print("response_source=", source)
          assert "/src/urllib3/response.py" in source
          PY
      - name: Differential correctness stress
        shell: bash
        run: python benchmarks/pr5304_gzip_evidence.py --mode correctness --cases 500 | tee correctness.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr5304-correctness-${{ matrix.os }}
          path: correctness.txt

  performance-ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Performance A/B
        shell: bash
        run: python benchmarks/pr5304_gzip_evidence.py --mode performance | tee performance.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr5304-performance
          path: performance.txt

  fallback-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Multi-member and bounded stress
        shell: bash
        run: python benchmarks/pr5304_gzip_evidence.py --mode fallback | tee fallback.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr5304-fallback
          path: fallback.txt

  memory-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Memory probe
        shell: bash
        run: python benchmarks/pr5304_gzip_evidence.py --mode memory | tee memory.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr5304-memory
          path: memory.txt
