name: gzip PR5304 evidence

on:
  workflow_dispatch:
  push:
    branches:
      - research/gzip-lazy-accumulator
    paths:
      - "benchmarks/pr5304_gzip_evidence.py"
      - ".github/workflows/gzip-pr5304-evidence.yml"
      - "src/urllib3/response.py"

jobs:
  correctness-stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-14
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Verify source provenance
        shell: bash
        run: |
          python - <<'PY'
          import urllib3.response
          source = urllib3.response.__file__.replace("\\", "/")
          print("response_source=", source)
          assert "/src/urllib3/response.py" in source
          PY
      - name: Differential correctness stress
        shell: bash
        run: python benchmarks/pr5304_gzip_evidence.py --mode correctness --cases 2000 | tee correctness.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr5304-correctness-${{ matrix.os }}
          path: correctness.txt

  performance-ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Performance A/B
        shell: bash
        run: python benchmarks/pr5304_gzip_evidence.py --mode performance | tee performance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr5304-performance
          path: performance.txt

  fallback-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Multi-member and bounded stress
        shell: bash
        run: python benchmarks/pr5304_gzip_evidence.py --mode fallback | tee fallback.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr5304-fallback
          path: fallback.txt

  memory-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Memory probe
        shell: bash
        run: python benchmarks/pr5304_gzip_evidence.py --mode memory | tee memory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr5304-memory
          path: memory.txt
