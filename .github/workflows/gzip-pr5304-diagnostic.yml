name: gzip PR5304 diagnostic slices

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: gzip-pr5304-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-case-246:
    strategy:
      fail-fast: false
      matrix:
        decoder_side: [baseline, candidate]
        members: [1, 2, 4, 8]
        max_length: [-1, 1]
    runs-on: macos-14
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Verify source provenance
        shell: bash
        run: |
          python - <<'PY'
          import urllib3.response
          source = urllib3.response.__file__.replace("\\", "/")
          print("response_source=", source)
          assert "/src/urllib3/response.py" in source
          PY
      - name: Run controlled gzip case
        shell: bash
        run: |
          python - <<'PY'
          import gzip
          import random
          import sys

          from benchmarks.pr5304_gzip_evidence import (
              BaselineGzipDecoder,
              run_stream,
          )
          from urllib3.response import GzipDecoder

          decoder_side = "${{ matrix.decoder_side }}"
          members = int("${{ matrix.members }}")
          max_length = int("${{ matrix.max_length }}")

          raw = random.Random(5304).randbytes(31)
          cuts = [round(i * len(raw) / members) for i in range(members + 1)]
          compressed = b"".join(
              gzip.compress(raw[cuts[i]:cuts[i + 1]])
              for i in range(members)
          )

          decoder_cls = (
              BaselineGzipDecoder if decoder_side == "baseline" else GzipDecoder
          )
          print(
              f"START side={decoder_side} members={members} "
              f"max_length={max_length} compressed={len(compressed)}",
              flush=True,
          )
          result = run_stream(
              decoder_cls,
              compressed,
              chunk_sizes=[64],
              limits=[max_length],
          )
          print(
              f"DONE side={decoder_side} members={members} "
              f"max_length={max_length} output={len(result[0])} "
              f"error={result[1]}",
              flush=True,
          )
          sys.exit(0 if result[1] is None else 1)
          PY
