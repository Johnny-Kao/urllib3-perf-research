name: gzip PR5304 diagnostic slices

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: gzip-pr5304-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-real-case-246:
    strategy:
      fail-fast: false
      matrix:
        decoder_side: [baseline, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install current source
        shell: bash
        run: python -m pip install -e .
      - name: Trace exact random-246 call boundary
        shell: bash
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import random

          from benchmarks.pr5304_gzip_evidence import BaselineGzipDecoder
          from urllib3.response import GzipDecoder

          side = "${{ matrix.decoder_side }}"
          raw = bytes.fromhex(
              "2d17d30751dc84f2803b1d9e3648bd4b2fce3d833502835871f95440788295"
          )
          cuts = [0, 6, 14, 17, 18, 19, 24, 30, 31]
          chunks = [64, 65536, 256]
          limits = [-1, 1, 8192]
          compressed = b"".join(
              gzip.compress(raw[cuts[j] : cuts[j + 1]], mtime=0)
              for j in range(8)
          )

          assert hashlib.sha256(raw).hexdigest() == (
              "ad1a02639be06e1013496d660707a9f19e5e476bb8edea7734b7de653f006a68"
          )
          assert hashlib.sha256(compressed).hexdigest() == (
              "d95cd9d73b8577e0b9c15d8c2aeafcd68fb80b7221d624a914ada4ae0b86afa9"
          )

          decoder = BaselineGzipDecoder() if side == "baseline" else GzipDecoder()
          pos = 0
          call = 0

          def marker():
              tail = getattr(decoder, "_unconsumed_tail", b"")
              obj = getattr(decoder, "_obj", None)
              return {
                  "tail_len": len(tail),
                  "state": getattr(decoder, "_state", None),
                  "eof": bool(getattr(obj, "eof", False)),
                  "unused_len": len(getattr(obj, "unused_data", b"") or b"") if obj else None,
                  "unconsumed_len": len(getattr(obj, "unconsumed_tail", b"") or b"") if obj else None,
              }

          print(f"side={side} compressed_len={len(compressed)}", flush=True)
          while pos < len(compressed):
              chunk_size = chunks[call % len(chunks)]
              limit = limits[call % len(limits)]
              piece = compressed[pos : pos + chunk_size]
              before = marker()
              print(
                  f"CALL {call} FEED pos={pos} piece_len={len(piece)} "
                  f"limit={limit} before={before}",
                  flush=True,
              )
              out = decoder.decompress(piece, max_length=limit)
              after = marker()
              print(
                  f"CALL {call} RETURN out_len={len(out)} after={after}",
                  flush=True,
              )
              pos += len(piece)
              call += 1

              drain = 0
              while decoder.has_unconsumed_tail and limit > 0:
                  before = marker()
                  print(
                      f"CALL {call}.{drain} DRAIN limit={limit} before={before}",
                      flush=True,
                  )
                  out = decoder.decompress(b"", max_length=limit)
                  after = marker()
                  print(
                      f"CALL {call}.{drain} DRAIN_RETURN out_len={len(out)} after={after}",
                      flush=True,
                  )
                  drain += 1
                  if drain > 256:
                      raise RuntimeError("drain guard exceeded")

          final_drain = 0
          while decoder.has_unconsumed_tail:
              limit = limits[call % len(limits)]
              if limit <= 0:
                  limit = -1
              before = marker()
              print(
                  f"FINAL {final_drain} limit={limit} before={before}",
                  flush=True,
              )
              out = decoder.decompress(b"", max_length=limit)
              after = marker()
              print(
                  f"FINAL {final_drain} RETURN out_len={len(out)} after={after}",
                  flush=True,
              )
              final_drain += 1
              if final_drain > 256:
                  raise RuntimeError("final drain guard exceeded")

          print("TRACE_COMPLETE", flush=True)
          PY
